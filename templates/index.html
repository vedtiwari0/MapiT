<!DOCTYPE html>

<html>

<head>
    <title>MapiT</title>


    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
        }

        /* INTRO */
        #intro {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle, #0f2027, #05080a);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 1s ease, visibility 1s;
        }

        #intro.hide {
            opacity: 0;
            visibility: hidden;
        }

        .intro-logo {
            font-size: 70px;
            letter-spacing: 4px;
            position: relative;
        }

        .stroke {
            color: transparent;
            -webkit-text-stroke: 1px rgba(255, 255, 255, 0.2);
        }

        .fill {
            position: absolute;
            left: 0;
            top: 0;
            color: transparent;
            background: linear-gradient(90deg, #00c6ff, #0072ff, #00e5ff);
            background-size: 200%;
            background-clip: content-box;
            -webkit-background-clip: text;
            animation: reveal 2s forwards, flow 3s linear infinite 1s;
        }

        @keyframes reveal {
            from {
                clip-path: inset(0 100% 0 0);
            }

            to {
                clip-path: inset(0 0 0 0);
            }
        }

        @keyframes flow {
            from {
                background-position: 0%;
            }

            to {
                background-position: 200%;
            }
        }

        /* HEADER */
        .logo-header {
            display: flex;
            justify-content: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
        }

        .logo-text .main {
            font-size: 28px;
            background: linear-gradient(45deg, #00c6ff, #00e5ff);
            background-clip: content-box;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* LAYOUT */
        .container {
            display: flex;
            gap: 20px;
            padding: 20px;
        }

        .panel {
            width: 320px;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 20px;
        }

        /* DROPDOWN */
        .dropdown {
            position: relative;
            margin-bottom: 15px;
        }

        .dropdown-btn {
            padding: 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.15);
            cursor: pointer;
        }

        .dropdown-menu {
            position: absolute;
            width: 100%;
            background: #1a1a1a;
            border-radius: 12px;
            margin-top: 6px;
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: 0.3s;
            z-index: 1000;
        }

        .dropdown-menu.active {
            max-height: 250px;
            opacity: 1;
            overflow-y: auto;
        }

        .dropdown-menu::-webkit-scrollbar {
            width: 6px;
        }

        .dropdown-menu::-webkit-scrollbar-thumb {
            background: #00c6ff;
            border-radius: 6px;
        }

        .search-box {
            width: 100%;
            padding: 8px;
            border: none;
            background: #222;
            color: white;
        }

        .dropdown-menu div {
            padding: 10px;
            cursor: pointer;
        }

        .dropdown-menu div:hover {
            background: #00c6ff33;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            color: white;
            cursor: pointer;
        }

        #map {
            flex: 1;
            height: 80vh;
            border-radius: 20px;
        }

        .info-box {
            margin-top: 15px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
        }

        @media(max-width:900px) {
            .container {
                flex-direction: column;
            }

            #map {
                height: 400px;
            }
        }
    </style>


</head>

<body>

    <div id="intro">
        <h1 class="intro-logo">
            <span class="stroke">MapiT</span>
            <span class="fill">MapiT</span>
        </h1>
    </div>

    <header class="logo-header">
        <div class="logo-text">
            <span class="main">MapiT</span>
        </div>
    </header>

    <div id="main-app">
        <div class="container">

            <div class="panel">

                <div class="dropdown">
                    <div class="dropdown-btn" onclick="toggleDropdown('startMenu')">
                        <span id="startText">Select Source</span>
                    </div>
                    <div class="dropdown-menu" id="startMenu">
                        <input class="search-box" onkeyup="filterCities(this,'startMenu')" placeholder="Search...">
                        {% for city in cities %}
                        <div onclick="selectCity('start','{{city}}')">{{city}}</div>
                        {% endfor %}
                    </div>
                </div>

                <div class="dropdown">
                    <div class="dropdown-btn" onclick="toggleDropdown('endMenu')">
                        <span id="endText">Select Destination</span>
                    </div>
                    <div class="dropdown-menu" id="endMenu">
                        <input class="search-box" onkeyup="filterCities(this,'endMenu')" placeholder="Search...">
                        {% for city in cities %}
                        <div onclick="selectCity('end','{{city}}')">{{city}}</div>
                        {% endfor %}
                    </div>
                </div>

                <button onclick="getRoute()">Find Route</button>

                <div class="info-box">
                    <div id="info"></div>
                    <div id="steps"></div>
                </div>

            </div>

            <div id="map"></div>

        </div>
    </div>

    <script>
        var map = L.map('map').setView([23.5, 78.5], 7);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        let selectedStart = "", selectedEnd = "", polyline, markers = [];

        fetch('/static/mp_boundry.geojson')
            .then(r => r.json())
            .then(data => {
                let b = L.geoJSON(data, { style: { color: "#00e5ff" } }).addTo(map);
                map.fitBounds(b.getBounds());
            });

        function toggleDropdown(id) {
            document.querySelectorAll('.dropdown-menu').forEach(m => {
                if (m.id !== id) m.classList.remove('active');
            });
            document.getElementById(id).classList.toggle('active');
        }

        document.addEventListener("click", function (e) {
            if (!e.target.closest(".dropdown")) {
                document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('active'));
            }
        });

        function selectCity(type, city) {
            if (type === 'start') { selectedStart = city; startText.innerText = city; }
            else { selectedEnd = city; endText.innerText = city; }
            document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('active'));
        }

        function filterCities(input, id) {
            let f = input.value.toLowerCase();
            let items = document.getElementById(id).getElementsByTagName("div");
            for (let i = 0; i < items.length; i++) {
                items[i].style.display = items[i].innerText.toLowerCase().includes(f) ? "block" : "none";
            }
        }

        const greenIcon = new L.Icon({
            iconUrl: 'https://maps.google.com/mapfiles/ms/icons/green-dot.png',
            iconSize: [32, 32],
            iconAnchor: [16, 32]
        });

        const blueIcon = new L.Icon({
            iconUrl: 'https://maps.google.com/mapfiles/ms/icons/blue-dot.png',
            iconSize: [32, 32],
            iconAnchor: [16, 32]
        });

        const redIcon = new L.Icon({
            iconUrl: 'https://maps.google.com/mapfiles/ms/icons/red-dot.png',
            iconSize: [32, 32],
            iconAnchor: [16, 32]
        });
        function getRoute() {
            if (!selectedStart || !selectedEnd) {
                alert("Select cities");
                return;
            }

            fetch('/route', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ start: selectedStart, end: selectedEnd })
            })
                .then(r => r.json())
                .then(data => {

                    if (polyline) map.removeLayer(polyline);
                    markers.forEach(m => map.removeLayer(m));
                    markers = [];

                    // DRAW REAL ROAD ROUTE
                    polyline = L.polyline(data.coordinates, {
                        color: "#00e5ff",
                        weight: 6
                    }).addTo(map);

                    map.fitBounds(polyline.getBounds());

                    // CUSTOM ICONS
                    const greenIcon = new L.Icon({
                        iconUrl: 'https://maps.google.com/mapfiles/ms/icons/green-dot.png',
                        iconSize: [32, 32],
                        iconAnchor: [16, 32]
                    });

                    const blueIcon = new L.Icon({
                        iconUrl: 'https://maps.google.com/mapfiles/ms/icons/blue-dot.png',
                        iconSize: [32, 32],
                        iconAnchor: [16, 32]
                    });

                    const redIcon = new L.Icon({
                        iconUrl: 'https://maps.google.com/mapfiles/ms/icons/red-dot.png',
                        iconSize: [32, 32],
                        iconAnchor: [16, 32]
                    });

                    // CORRECT MARKERS USING CITY COORDS
                    data.path.forEach((city, i) => {

                        let coord = data.city_coords[i];  //FIXED LINE

                        let icon;

                        if (i === 0) {
                            icon = greenIcon; // Source
                        }
                        else if (i === data.path.length - 1) {
                            icon = redIcon; // Destination
                        }
                        else {
                            icon = blueIcon; // Intermediate
                        }

                        let marker = L.marker(coord, { icon: icon })
                            .addTo(map)
                            .bindPopup(`<b>${city}</b>`);

                        markers.push(marker);
                    });

                    // INFO DISPLAY
                    document.getElementById("info").innerHTML =
                        "Distance: " + data.distance + " km";

                    document.getElementById("steps").innerHTML =
                        data.path.join(" ➝ ");
                });
        }

        // intro exit
        window.addEventListener("load", () => {
            setTimeout(() => {
                document.getElementById("intro").classList.add("hide");
            }, 2500);
        });
    </script>

</body>

</html>
